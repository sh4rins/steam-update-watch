name: diag

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, opt: "seccomp=unconfined" }
          - { os: ubuntu-22.04, opt: "no-new-privileges=false" }
          - { os: ubuntu-22.04, opt: "seccomp=unconfined" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Testar SteamCMD
        run: |
          uname -r
          docker --version
          timeout 100 docker run --rm --security-opt ${{ matrix.opt }} steamcmd/steamcmd:latest +login anonymous +app_info_update 1 +app_info_print 4080220 +quit 2>&1 | grep -E 'Connecting|FAILED|OK|buildid|socket' | head -8 || true
